name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Pinned to the version this suite is developed against. It spins up
      # its own throwaway solana-test-validator; nothing here reaches
      # devnet or mainnet.
      - name: Install Solana CLI
        working-directory: ${{ runner.temp }}
        env:
          SOLANA_VERSION: "2.3.11"
          SOLANA_SHA256: "3127d066a6b9e3e5e5558a2d34112434a60d0410800d94e6bb12714315dc5f26"
        run: |
          archive=solana-release-x86_64-unknown-linux-gnu.tar.bz2
          curl -sSfLO "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/${archive}"
          echo "${SOLANA_SHA256}  ${archive}" | sha256sum --check
          tar -xjf "${archive}"
          echo "${PWD}/solana-release/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: npm run test:integration

  build:
    name: Build and pack
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          npm pack
          tarball=$(ls noirwire-shared-*.tgz)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${tarball}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: |
          tarball=$(ls noirwire-shared-*.tgz)
          files=$(tar -tzf "$tarball")
          if ! echo "$files" | grep -q '^package/dist/'; then
            echo "dist/ is missing from the packed tarball" >&2
            exit 1
          fi
          if echo "$files" | grep -Eq '^package/(tests/|src/.*\.test\.)'; then
            echo "test files leaked into the packed tarball" >&2
            exit 1
          fi

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Verify the tarball is the one that was built
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum --check

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [${version}]" '
            index($0, want) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          printf '\nSHA-256 of %s: %s\n' "$TARBALL" "$SHA256" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
