name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Pinned to the version this suite is developed against. It spins up
      # its own throwaway solana-test-validator; nothing here reaches
      # devnet or mainnet.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.11/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Verify package contents
        run: |
          tarball=$(ls noirwire-shared-*.tgz)
          files=$(tar -tzf "$tarball")
          if ! echo "$files" | grep -q '^package/dist/'; then
            echo "dist/ is missing from the packed tarball" >&2
            exit 1
          fi
          if echo "$files" | grep -Eq '^package/(tests/|src/.*\.test\.)'; then
            echo "test files leaked into the packed tarball" >&2
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [${version}]" '
            index($0, want) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" noirwire-shared-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
